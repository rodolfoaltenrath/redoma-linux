[package]
name = "redoma"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rodolfoaltenrath/redoma-linux"
description = "Executa o app oficial Certisign no Linux, isolado em contêiner Waydroid"
publish = false

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
async-channel = "2"
gtk = { version = "0.11", package = "gtk4" }
libc = "0.2"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
